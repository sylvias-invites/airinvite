<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #e0f2fe, #fef2f2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    /* Celá souprava letadlo -> provázek -> papír */
    .flight-container {
      position: absolute;
      left: -800px; /* Startuje úplně vlevo mimo obrazovku */
      top: 42%;
      display: flex;
      align-items: center;
      /* Animace příletu: trvá 4 sekundy, zastaví se uprostřed */
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Letadlo směřující doprava */
    .airplane {
      width: 90px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      flex-shrink: 0;
    }

    /* Provázek táhnoucí se za letadlem */
    .string {
      width: 80px;
      height: 2px;
      border-top: 2px dashed #b0b0b0;
      flex-shrink: 0;
    }

    /* Okrasný svatební papír */
    .banner {
      background: linear-gradient(135deg, #fffdfa 0%, #fff5f7 100%);
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(190, 24, 93, 0.12);
      border: 2px solid #fbcfe8;
      position: relative;
      text-align: center;
      flex-shrink: 0;
      transform-origin: left center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    /* Vnitřní ozdobný rámeček */
    .banner::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px dashed #f472b6;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.5;
    }

    .banner h1 {
      margin: 0 0 8px 0;
      color: #9d174d;
      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .banner p {
      margin: 0;
      color: #6b7280;
      font-size: 1rem;
      font-style: italic;
    }

    /* Animace příletu zleva na střed */
    @keyframes flyIn {
      0% {
        left: -800px;
      }
      100% {
        left: 50%;
        transform: translateX(-50%);
      }
    }

    /* Jemné vlání papírku po zastavení */
    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-5px);
      }
    }
  </style>
</head>
<body>

  <div class="flight-container">
    <!-- Letadlo (správně otočené špičkou doprava) -->
    <svg class="airplane" viewBox="0 0 512 512" fill="#db2777" xmlns="http://www.w3.org/2000/svg">
      <path d="M480.32,204.51L83.27,11.23C43.16-8.23,0,19.24,0,63.95v116.4c0,15.24,11.28,28.02,26.4,29.74l287.41,32.74c4.1,0.47,7.21,3.87,7.21,8.02c0,4.15-3.11,7.55-7.21,8.02L26.4,282.16C11.28,283.88,0,296.66,0,311.9v116.4c0,44.71,43.16,72.18,83.27,52.72l397.05-193.28C522.65,270.66,522.65,241.34,480.32,204.51z"/>
    </svg>

    <!-- Provázek -->
    <div class="string"></div>

    <!-- Okrasný papír -->
    <div class="banner">
      <h1>Zveme tě na naši svatbu 🩷</h1>
      <p>Anežka & Kuba</p>
    </div>
  </div>

</body>
</html>
