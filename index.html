<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      /* Nádherný přechod: nahoře nebesky modrá, uprostřed jemný přechod, dole červánkově růžová až červená */
      background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 45%, #fbcfe8 70%, #f43f5e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flight-container {
      position: absolute;
      left: -800px;
      top: 35%;
      display: flex;
      align-items: center;
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Váš obrázek plakátku/papíru */
    .banner-img {
      width: 320px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      transform-origin: right center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    /* Provázek mezi nimi */
    .string {
      width: 60px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.7); /* Světlejší provázek, aby hezky vynikl */
      flex-shrink: 0;
    }

    /* Váš obrázek letadla */
    .airplane-img {
      width: 90px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      flex-shrink: 0;
      transform: scaleX(-1); 
    }

    @keyframes flyIn {
      0% {
        left: -800px;
      }
      100% {
        left: 50%;
        transform: translateX(-50%);
      }
    }

    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-5px);
      }
    }
  </style>
</head>
<body>

  <div class="flight-container">
    <!-- 1. Tvůj obrázek pozvánky (nahraj do složky jako ticket.png) -->
    <img src="ticket.png" alt="Svatební pozvánka" class="banner-img">

    <!-- 2. Provázek -->
    <div class="string"></div>

    <!-- 3. Tvůj obrázek letadla (nahraj do složky jako plane.png) -->
    <img src="plane.png" alt="Letadlo" class="airplane-img">
  </div>

</body>
</html>
