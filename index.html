<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;

      /* Obrázek jako pozadí celé obrazovky */
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Hlavní kontejner – pevně drží prvcích pod sebou bez poskakování */
    .scratch-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Nadpis - pevná pozice, nikdy se neposune */
    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #2c2c2c;
      margin: 0 0 20px 0;
      font-weight: normal;
      text-align: center;
      flex-shrink: 0;
    }

    /* Kontejner pro letadlo a lístek */
    .flight-container {
      display: flex;
      align-items: center;
      position: relative;
      /* Animace příletu zleva na střed */
      animation: flyIn 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Obrázek letenky */
    .banner-img {
      width: 270px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      animation: wave 3s ease-in-out infinite alternate, centerTicket 0.8s ease 3.5s forwards;
    }

    /* Provázek a letadlo */
    .string, .airplane-img {
      flex-shrink: 0;
      transition: opacity 0.8s ease;
    }

    /* Provázek */
    .string {
      width: 50px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.8);
      /* Po 3.5 sekundách provázek zprůhlední, ale nekolabuje do šířky 0 */
      animation: fadeOutOnly 0.8s ease 3.5s forwards;
    }

    /* Obrázek letadla */
    .airplane-img {
      width: 140px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      /* Po 3.5 sekundách letadlo zprůhlední v klidu na místě */
      animation: fadeOutOnly 0.8s ease 3.5s forwards;
    }

    /* Animace příletu celé soupravy */
    @keyframes flyIn {
      0% {
        transform: translateX(-100vw);
      }
      100% {
        transform: translateX(0);
      }
    }

    /* Čisté zmizení bez poskakování šířky */
    @keyframes fadeOutOnly {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        pointer-events: none;
      }
    }

    /* Jemné vlání letenky */
    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-4px);
      }
    }

    @keyframes centerTicket {
      0 % { 
        transform: translateX(0);
      }
      100% {
        transform: translateX(95px);
      }
    }

    /* Tlačítko pro přechod dál */
    .next-btn {
      margin-top: 35px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #d4a373; /* Jemný zlatavý/elegantní okraj */
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      /* Zobrazí se plynule po doletu */
      animation: showBtn 0.6s ease 4s forwards;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    @keyframes showBtn {
      to {
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <div class="scratch-screen" id="scratch-screen">
    <!-- Nadpis zůstává pevně nahoře a ani se nehne -->
    <h1 class="main-title" id="main-title">Ema a Míša</h1>
      
    <div class="flight-container">
      <!-- 1. Letenka -->
      <img src="ticket.jpeg" alt="Svatební pozvánka" class="banner-img">

      <!-- 2. Provázek -->
      <div class="string"></div>

      <!-- 3. Letadlo -->
      <img src="plane.png" alt="Letadlo" class="airplane-img">
    </div>

    <!-- Tlačítko pod letenkou -->
    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

</body>
</html>
