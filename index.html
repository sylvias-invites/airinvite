<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      /* Přechod pozadí: nahoře modrá, dole růžová/červená */
      background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 45%, #fbcfe8 70%, #f43f5e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Hlavní kontejner drží všechno krásně uprostřed pod sebou */
    .scratch-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #000000;
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: normal;
      text-align: center;
    }

    /* Kontejner pro letadlo a lístek – nyní se animuje přirozeně na středu */
    .flight-container {
      display: flex;
      align-items: center;
      position: relative;
      /* Animace příletu zleva */
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Obrázek plakátku/papíru */
    .banner-img {
      width: 250px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      transform-origin: right center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    /* Provázek mezi nimi */
    .string {
      width: 60px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.7);
      flex-shrink: 0;
    }

    /* Obrázek letadla */
    .airplane-img {
      width: 150px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      flex-shrink: 0;
    }

    /* Animace příletu: startuje vlevo mimo obrazovku a dojede na střed */
    @keyframes flyIn {
      0% {
        transform: translateX(-100vw);
      }
      100% {
        transform: translateX(0);
      }
    }

    /* Jemné vlání papíru */
    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-5px);
      }
    }

    /* Tlačítko pro přechod dál */
    .next-btn {
      margin-top: 30px;
      padding: 12px 28px;
      background-color: #dce0ff;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 25px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background-color 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Ema a Marek</h1>
      
    <div class="flight-container">
      <!-- 1. Obrázek pozvánky -->
      <img src="ticket.png" alt="Svatební pozvánka" class="banner-img">

      <!-- 2. Provázek -->
      <div class="string"></div>

      <!-- 3. Obrázek letadla -->
      <img src="plane.png" alt="Letadlo" class="airplane-img">
    </div>

    <!-- Tlačítko pod letadlem -->
    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

</body>
</html>
