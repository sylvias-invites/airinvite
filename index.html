<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      /* Nádherný přechod: nahoře nebesky modrá, uprostřed jemný přechod, dole červánkově růžová až červená */
      background: linear-gradient(to bottom, #bae6fd 0%, #e0f2fe 45%, #fbcfe8 70%, #f43f5e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scratch-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
   }

.main-title {
    font-family: 'Great Vibes', cursive;;
    font-size: 2.8rem;
    color: #000000;
    margin-top: 32px;
    margin-bottom: 8px;
    font-weight: normal;
    transition: opacity 0.6s ease;
}

    .flight-container {
      position: absolute;
      left: -800px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Váš obrázek plakátku/papíru */
    .banner-img {
      width: 250px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      transform-origin: right center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    /* Provázek mezi nimi */
    .string {
      width: 60px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.7); /* Světlejší provázek, aby hezky vynikl */
      flex-shrink: 0;
    }

    /* Váš obrázek letadla */
    .airplane-img {
      width: 150px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      flex-shrink: 0;
    }

    @keyframes flyIn {
      0% {
        left: -800px;
        transform: translateY(-50%);
      }
      100% {
        left: 50%;
        transform: translateX(-50%);
      }
    }

    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-5px);
      }
    }

    /* Tlačítko pro přechod dál */
.next-btn {
    margin-top: 20px;
    padding: 12px 28px;
    
    /* pozadí a černý text */
    background-color: #dce0ff;
    color: #000000;
    
    border: 2px solid #000000;
    border-radius: 25px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background-color 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.next-btn.visible {
    opacity: 1;
    pointer-events: auto;
}
    
</style>
</head>
<body>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Ema a Marek</h1>
      
    <div class="flight-container">
      <!-- 1. Obrázek pozvánky -->
      <img src="ticket.png" alt="Svatební pozvánka" class="banner-img">

      <!-- 2. Provázek -->
      <div class="string"></div>

      <!-- 3. Obrázek letadla -->
      <img src="plane.png" alt="Letadlo" class="airplane-img">
    </div>

    <!-- Tlačítko je teď správně VENKU pod letadlem, aby se dalo umístit kamkoliv -->
    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>

  </div>

</body>

</body>
</html>
