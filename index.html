<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scratch-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #2c2c2c;
      margin: 0 0 20px 0;
      font-weight: normal;
      text-align: center;
      flex-shrink: 0;
    }

    /* 1. Úvodní text: objeví se hned, v čase 2.5s zmizí */
    .intro-text {
      font-size: 1.2rem;
      color: #4a4a4a;
      margin-bottom: 25px;
      letter-spacing: 1px;
      font-style: italic;
      animation: hideText 0.5s ease 2.5s forwards;
    }

    /* 2. Kontejner přiletí od 3. do 7. sekundy (trvá 4s) */
    .flight-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      opacity: 0; /* Ze začátku neviditelný, než začne letět */
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) 3s forwards;
    }

    /* Letenka */
    .banner-img {
      width: 270px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      /* Vlání jede pořád, v 7. sekundy se zvětší */
      animation: wave 3s ease-in-out infinite alternate, centerTicket 0.6s ease 7s forwards;
    }

    /* Provázek a letadlo - v 7. sekundě se úplně schovají a vypnou */
    .string, .airplane-img {
      flex-shrink: 0;
      animation: hidePlane 0.6s ease 7s forwards;
    }

    .string {
      width: 50px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.8);
    }

    .airplane-img {
      width: 140px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
    }

    /* ANIMACE */

    @keyframes hideText {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes flyIn {
      0% {
        opacity: 0;
        transform: translateX(-100vw);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes hidePlane {
      0% {
        opacity: 1;
      }
      99% {
        opacity: 0;
        pointer-events: none;
      }
      100% {
        opacity: 0;
        display: none;
        pointer-events: none;
      }
    }

    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-4px);
      }
    }

    @keyframes centerTicket {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.4);
      }
    }

    /* Tlačítko se ukáže v 7.5 sekundě */
    .next-btn {
      margin-top: 35px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #d4a373;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      animation: showBtn 0.6s ease 7.5s forwards;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    @keyframes showBtn {
      to {
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Míša a Alex</h1>
    <div class="intro-text">Mám pro tebe překvapení...</div>
    
    <div class="flight-container">
      <img src="ticket.jpeg" alt="Svatební pozvánka" class="banner-img">
      <div class="string"></div>
      <img src="plane.png" alt="Letadlo" class="airplane-img">
    </div>

    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

</body>
</html>
