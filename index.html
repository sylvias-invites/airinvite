<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .scratch-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #2c2c2c;
      margin: 0 0 20px 0;
      font-weight: normal;
      text-align: center;
      flex-shrink: 0;
    }

    /* Kontejner s animací letu */
    .flight-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: flightSequence 9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Letenka - zpočátku skrytá, objeví se při druhém příletu v 5. sekundě */
    .banner-img {
      width: 270px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      flex-shrink: 0;
      opacity: 0;
      animation: showTicket 0.1s ease 5s forwards, wave 3s ease-in-out infinite alternate, centerTicket 0.6s ease 9s forwards;
    }

    /* Provázek a letadlo */
    .string, .airplane-img {
      flex-shrink: 0;
      animation: hidePlaneSmooth 0.6s ease 9s forwards;
    }

    .string {
      width: 50px;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.8);
    }

    .airplane-img {
      width: 140px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.2));
      animation: planeFlip 9s linear forwards;
    }

    /* ANIMACE PŘÍBĚHU */

    @keyframes flightSequence {
      0% {
        transform: translateX(-120vw) translateY(0) scaleX(-1);
      }
      /* První let zleva doprava přes oblouk */
      20% {
        transform: translateX(-20vw) translateY(-40px) scaleX(-1);
      }
      40% {
        transform: translateX(60vw) translateY(20px) scaleX(-1);
      }
      /* Odlet úplně vpravo mimo obrazovku */
      48% {
        transform: translateX(120vw) translateY(50px) scaleX(-1);
        opacity: 1;
      }
      /* Rychlý neviditelný přesun zpět na levou stranu, otočení čumáku doleva */
      49% {
        transform: translateX(120vw) translateY(0) scaleX(1);
        opacity: 0;
      }
      50% {
        transform: translateX(120vw) translateY(0) scaleX(1);
        opacity: 1;
      }
      /* Druhý přílet zprava doleva s letenkou na střed */
      100% {
        transform: translateX(0) translateY(0) scaleX(1);
        opacity: 1;
      }
    }

    /* Otočení letadla podle směru letu */
    @keyframes planeFlip {
      0% {
        transform: scaleX(-1); /* Čumák vpravo (letí zleva doprava) */
      }
      49% {
        transform: scaleX(-1);
      }
      50% {
        transform: scaleX(1); /* Čumák vlevo (letí zprava doleva) */
      }
      100% {
        transform: scaleX(1);
      }
    }

    @keyframes showTicket {
      to {
        opacity: 1;
      }
    }

    @keyframes hidePlaneSmooth {
      0% {
        opacity: 1;
        visibility: visible;
      }
      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-4px);
      }
    }

    @keyframes centerTicket {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.4);
      }
    }

    /* Tlačítko */
    .next-btn {
      margin-top: 35px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #d4a373;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      animation: showBtn 0.6s ease 9.5s forwards;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    @keyframes showBtn {
      to {
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Míša a Alex</h1>
    
    <div class="flight-container">
      <img src="ticket.jpeg" alt="Svatební pozvánka" class="banner-img">
      <div class="string"></div>
      <img src="plane.png" alt="Letadlo" class="airplane-img">
    </div>

    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

</body>
</html>
