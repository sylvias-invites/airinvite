<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #e0f2fe, #fef2f2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    .flight-container {
      position: absolute;
      /* Začínáme tak daleko vlevo, aby byla celá souprava schovaná */
      left: -500px;
      top: 42%;
      display: flex;
      align-items: center;
      /* Přiletíme na střed obrazovky */
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .banner {
      background: linear-gradient(135deg, #fffdfa 0%, #ECA4B2 100%);
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(190, 24, 93, 0.12);
      border: 2px solid #fbcfe8;
      position: relative;
      text-align: center;
      flex-shrink: 0;
      transform-origin: right center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    .banner::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px dashed #F5CFE3;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.5;
    }

    .banner h1 {
      margin: 0 0 8px 0;
      color: #131313;
      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .banner p {
      margin: 0;
      color: #6b7280;
      font-size: 1rem;
      font-style: italic;
    }

    .string {
      width: 70px;
      height: 2px;
      border-top: 2px dashed #b0b0b0;
      flex-shrink: 0;
    }

    .airplane {
      width: 65px;
      height: auto;
      filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.15));
      flex-shrink: 0;
      /* Otočíme letadlo špičkou doprava, aby táhlo soupravu */
      transform: scaleX(-1);
    }

    @keyframes flyIn {
      0% {
        left: -600px;
      }
      100% {
        left: 50%;
        transform: translateX(-50%);
      }
    }

    @keyframes wave {
      0% {
        transform: rotate(-1deg) translateY(0px);
      }
      100% {
        transform: rotate(2deg) translateY(-5px);
      }
    }
  </style>
</head>
<body>

  <div class="flight-container">
    <!-- 1. Vlevo bude teď papírek -->
    <div class="banner">
      <h1>Zveme tě na naši svatbu 🩷</h1>
      <p>Anežka & Kuba</p>
    </div>

    <!-- 2. Uprostřed provázek -->
    <div class="string"></div>

    <!-- 3. Vpravo letadlo, které táhne celou soupravu dopředu -->
    <svg class="airplane" viewBox="0 0 24 24" fill="#322B2E" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </div>

</body>
</html>
