<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #e0f2fe, #fef2f2);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    /* Kontejnér startuje zcela mimo obrazovku vlevo */
    .flight-container {
      position: absolute;
      left: -700px;
      top: 40%;
      display: flex;
      align-items: center;
      /* Animace příletu do středu obrazovky */
      animation: flyIn 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Styl letadla (otočené tak, aby letělo špičkou doprava) */
    .airplane {
      width: 75px;
      height: auto;
      transform: rotate(0deg); /* Pokud by letělo špatně, můžeme otočit */
      filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.2));
      flex-shrink: 0;
    }

    /* Provázek */
    .string {
      width: 70px;
      height: 2px;
      border-top: 2px dashed #b0b0b0;
      flex-shrink: 0;
    }

    /* Okrasný svatební papír */
    .banner {
      background: linear-gradient(135deg, #fffdfa 0%, #fff5f7 100%);
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(190, 24, 93, 0.12);
      border: 2px solid #fbcfe8;
      position: relative;
      text-align: center;
      flex-shrink: 0;
      transform-origin: left center;
      animation: wave 3s ease-in-out infinite alternate;
    }

    /* Vnitřní ozdobný rámeček */
    .banner::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px dashed #f472b6;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.5;
    }

    .banner h1 {
      margin: 0 0 8px 0;
      color: #9d174d;
      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .banner p {
      margin: 0;
      color: #6b7280;
      font-size: 1rem;
      font-style: italic;
    }

    /* Klíčové snímky pro přílet – dojede na střed obrazovky */
    @keyframes flyIn {
      0% {
        left: -700px;
      }
      100% {
        left: 50%;
        transform: translateX(-50%); /* Vycentruje celou soupravu přesně na střed */
      }
    }

    /* Jemné vlání papírku */
    @keyframes wave {
      0% {
        transform: rotate(-1.5deg) translateY(0px);
      }
      100% {
        transform: rotate(2.5deg) translateY(-6px);
      }
    }
  </style>
</head>
<body>

  <div class="flight-container">
    <!-- 1. Letadlo (poletí vepředu) -->
    <svg class="airplane" viewBox="0 0 24 24" fill="#db2777" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    </svg>

    <!-- 2. Provázek -->
    <div class="string"></div>

    <!-- 3. Okrasný papír -->
    <div class="banner">
      <h1>Zveme tě na naši svatbu 🩷</h1>
      <p>Anežka & Kuba</p>
    </div>
  </div>

</body>
</html>
